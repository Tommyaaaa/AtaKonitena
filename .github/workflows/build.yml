# =====================================================================
# AtaKonitena —— Flutter 全平台 CI 工作流
# 平台：Android / iOS / Web / Linux / macOS / Windows
# 触发：push / PR 到 main，或手动 dispatch
# =====================================================================
name: Build AtaKonitena (All Platforms)

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: atakonitena-build-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.2"

jobs:
  # ------------------------------------------------------------------
  # 静态检查 + 单元测试（Dart 层，与平台无关）
  # ------------------------------------------------------------------
  analyze:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Enable web
        run: flutter config --enable-web --no-analytics

      - name: Get packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

  # ------------------------------------------------------------------
  # Android（APK + AppBundle）
  # ------------------------------------------------------------------
  android:
    name: Android
    runs-on: ubuntu-latest
    needs: analyze
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          java-version: "17"

      - name: Get packages
        run: flutter pub get

      - name: Build APK (split per ABI)
        run: flutter build apk --release --split-per-abi

      - name: Build AppBundle
        run: flutter build appbundle --release

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: atakonitena-android-apk
          path: |
            build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

      - name: Upload AppBundle
        uses: actions/upload-artifact@v4
        with:
          name: atakonitena-android-aab
          path: |
            build/app/outputs/bundle/release/*.aab
          if-no-files-found: error

  # ------------------------------------------------------------------
  # iOS（无签名构建，产出 .app；IPA 需在带签名的 runner 上做）
  # ------------------------------------------------------------------
  ios:
    name: iOS (unsigned)
    runs-on: macos-14
    needs: analyze
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Get packages
        run: flutter pub get

      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign

      - name: Package .app
        run: |
          cd build/ios/iphoneos
          zip -r ../../../atakonitena-ios.app.zip Runner.app

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: atakonitena-ios
          path: atakonitena-ios.app.zip
          if-no-files-found: error

  # ------------------------------------------------------------------
  # Web（Static Build）
  # ------------------------------------------------------------------
  web:
    name: Web
    runs-on: ubuntu-latest
    needs: analyze
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Enable web
        run: flutter config --enable-web --no-analytics

      - name: Get packages
        run: flutter pub get

      - name: Build Web
        run: flutter build web --release

      - name: Upload Web
        uses: actions/upload-artifact@v4
        with:
          name: atakonitena-web
          path: build/web
          if-no-files-found: error

  # ------------------------------------------------------------------
  # Linux（Debian bundle）
  # ------------------------------------------------------------------
  linux:
    name: Linux
    runs-on: ubuntu-latest
    needs: analyze
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang cmake ninja-build libgtk-3-dev liblzma-dev libstdc++-12-dev pkg-config

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Enable Linux
        run: flutter config --enable-linux-desktop --no-analytics

      - name: Get packages
        run: flutter pub get

      - name: Build Linux
        run: flutter build linux --release

      - name: Package bundle
        run: |
          cd build/linux/x64/release/bundle
          tar czf "$GITHUB_WORKSPACE/atakonitena-linux.tar.gz" .

      - name: Upload Linux
        uses: actions/upload-artifact@v4
        with:
          name: atakonitena-linux
          path: atakonitena-linux.tar.gz
          if-no-files-found: error

  # ------------------------------------------------------------------
  # macOS（Apple Silicon + Intel）
  # ------------------------------------------------------------------
  macos:
    name: macOS
    runs-on: macos-14
    needs: analyze
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Enable macOS
        run: flutter config --enable-macos-desktop --no-analytics

      - name: Get packages
        run: flutter pub get

      # 在 macos-14 (Apple Silicon) 上默认产出 arm64；如需 Intel 包，
      # 可在 x86_64 的 runner 上执行本 job 或设置 CMAKE_OSX_ARCHITECTURES。
      - name: Build macOS (arm64 host)
        run: flutter build macos --release

      - name: Package .app
        run: |
          cd build/macos/Build/Products/Release
          zip -r ../../../../../atakonitena-macos.zip AtaKonitena.app

      - name: Upload macOS
        uses: actions/upload-artifact@v4
        with:
          name: atakonitena-macos
          path: atakonitena-macos.zip
          if-no-files-found: error

  # ------------------------------------------------------------------
  # Windows（x64 Release）
  # ------------------------------------------------------------------
  windows:
    name: Windows
    runs-on: windows-latest
    needs: analyze
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Enable Windows
        run: flutter config --enable-windows-desktop --no-analytics

      - name: Get packages
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Upload Windows
        uses: actions/upload-artifact@v4
        with:
          name: atakonitena-windows
          path: build/windows/x64/runner/Release
          if-no-files-found: error

  # ------------------------------------------------------------------
  # 发布：打 tag 时汇总产物到 GitHub Release
  # ------------------------------------------------------------------
  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, ios, web, linux, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "AtaKonitena ${{ github.ref_name }}"
          draft: true
          files: artifacts/**/*
          generate_release_notes: true